/**
 * Render Deployment Configuration for Scootix
 */
services:
  - type: web
    name: scootix
    runtime: node
    plan: free # Change to starter if needed
    buildCommand: npm install && prisma generate && npm run build
    startCommand: prisma migrate deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: 18 # or the version you are using
      - key: DATABASE_URL
        fromDatabase:
          name: scootix-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://scootix.onrender.com # Change this if you have a custom domain
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: scootix-db
    plan: free
